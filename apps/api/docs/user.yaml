tags:
    - name: Users
      description: User management endpoints
paths:
    /check-email:
        post:
            tags:
                - Users
            summary: Check whether an email address exists
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CheckEmailRequest"
            responses:
                "200":
                    description: Email existence result
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CheckEmailResponse"
                "400":
                    description: Bad request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /register:
        post:
            tags:
                - Users
            summary: Register a new user
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RegisterRequest"
            responses:
                "201":
                    description: User registered successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                        example: User registered successfully
                                    user:
                                        $ref: "#/components/schemas/User"
                "400":
                    description: Bad request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /login:
        post:
            tags:
                - Users
            summary: Authenticate a user and return an access token
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LoginRequest"
            responses:
                "200":
                    description: Authentication successful
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/LoginResponse"
                "400":
                    description: Bad request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "401":
                    description: Incorrect email or password
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "404":
                    description: No email found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /details:
        get:
            tags:
                - Users
            summary: Get profile of the authenticated user
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: User profile
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserPublic"
                "403":
                    description: User not found or authentication failed
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /reset-password:
        post:
            tags:
                - Users
            summary: Reset password for authenticated user
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ResetPasswordRequest"
            responses:
                "200":
                    description: Password reset
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MessageResponse"
                "400":
                    description: Bad request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "403":
                    description: Authentication failed
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /profile:
        put:
            tags:
                - Users
            summary: Update profile of authenticated user
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateProfileRequest"
            responses:
                "200":
                    description: Updated user profile
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserPublic"
                "400":
                    description: Bad request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "403":
                    description: Authentication failed
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "404":
                    description: Not found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
components:
    schemas:
        CheckEmailRequest:
            type: object
            required:
                - email
            additionalProperties: false
            properties:
                email:
                    type: string
                    format: email
                    example: user@example.com
        CheckEmailResponse:
            type: object
            additionalProperties: false
            properties:
                message:
                    type: string
                    minLength: 1
                    example: Email exists
                emailExists:
                    type: boolean
                    example: true
        RegisterRequest:
            type: object
            additionalProperties: false
            required:
                - firstName
                - lastName
                - email
                - password
                - mobileNo
            properties:
                firstName:
                    type: string
                    minLength: 1
                    example: John
                lastName:
                    type: string
                    minLength: 1
                    example: Doe
                email:
                    type: string
                    format: email
                    example: john.doe@example.com
                password:
                    type: string
                    minLength: 8
                    example: passw0rd
                mobileNo:
                    type: string
                    pattern: '^(09|\+639)\d{9}$'
                    minLength: 11
                    maxLength: 13
                    example: "09171234567"
        LoginRequest:
            type: object
            additionalProperties: false
            required:
                - email
                - password
            properties:
                email:
                    type: string
                    format: email
                    example: john.doe@example.com
                password:
                    type: string
                    minLength: 8
                    example: passw0rd
        LoginResponse:
            type: object
            additionalProperties: false
            properties:
                message:
                    type: string
                    example: User logged in successfully
                access:
                    type: string
                    description: JWT access token
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        User:
            type: object
            properties:
                _id:
                    $ref: "#/components/schemas/ObjectId"
                firstName:
                    type: string
                    example: John
                lastName:
                    type: string
                    example: Doe
                email:
                    type: string
                    format: email
                    example: john.doe@example.com
                mobileNo:
                    type: string
                    pattern: '^(09|\+639)\d{9}$'
                    minLength: 11
                    maxLength: 13
                    example: "09171234567"
                isAdmin:
                    type: boolean
                    example: false
                password:
                    type: string
                    example: "$2a$10$somehashedpassword"
        UserPublic:
            allOf:
                - $ref: "#/components/schemas/User"
                - type: object
                  properties:
                      password:
                          type: string
                          description: Password will be empty string in responses
                          example: ""
        ResetPasswordRequest:
            type: object
            required:
                - newPassword
            properties:
                newPassword:
                    type: string
                    minLength: 8
                    example: newStrongPass1
        UpdateProfileRequest:
            type: object
            additionalProperties: false
            minProperties: 1
            properties:
                firstName:
                    type: string
                    minLength: 1
                    example: John
                lastName:
                    type: string
                    minLength: 1
                    example: Doe
                mobileNo:
                    type: string
                    pattern: '^(09|\+639)\d{9}$'
                    minLength: 11
                    maxLength: 13
                    example: "09171234567"
        MessageResponse:
            type: object
            additionalProperties: false
            properties:
                message:
                    type: string
                    example: Password reset successfully
        ErrorResponse:
            type: object
            additionalProperties: false
            properties:
                message:
                    type: string
                    example: Mobile number is invalid
        ObjectId:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
            minLength: 24
            maxLength: 24
            example: "64a1b2c3d4e5f60012345678"
