version: "3.8"

services:
    api:
        build:
            context: ./api
            dockerfile: Dockerfile.prod
        ports:
            - "5000:5000"
        restart: always
        env_file:
            - .env.prod

    client:
        build:
            context: ./client
            dockerfile: Dockerfile.prod
            args:
                - VITE_API_URL=${VITE_API_URL}
        ports:
            - "80:80"
        restart: always
        env_file:
            - .env.prod
        depends_on:
            - api
