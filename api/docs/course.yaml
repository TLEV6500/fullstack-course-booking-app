tags:
    - name: Courses
      description: Course management endpoints
paths:
    /:
        post:
            tags:
                - Courses
            summary: Add a new course (admin only)
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateCourseRequest"
            responses:
                "201":
                    description: Course added successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Course added successfully
                                    result:
                                        $ref: "#/components/schemas/Course"
                "400":
                    description: Bad request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "403":
                    description: Authentication or authorization failed
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "409":
                    description: Course already exists
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
        get:
            tags:
                - Courses
            summary: Get all active courses
            description: Returns only courses with isActive = true
            responses:
                "200":
                    description: A list of active courses or an empty array when none exist
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Course"
    /all:
        get:
            tags:
                - Courses
            summary: Get all courses (admin only)
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: List of all courses
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Course"
                "403":
                    description: Authentication or authorization failed
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "404":
                    description: No courses found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /specific/{id}:
        get:
            tags:
                - Courses
            summary: Get a course by id
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      $ref: "#/components/schemas/ObjectId"
                  description: The course id, following MongoDB ObjectId format
            responses:
                "200":
                    description: Course found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Course"
                "400":
                    description: Bad request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "404":
                    description: Course not found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /{courseId}:
        patch:
            tags:
                - Courses
            summary: Update a course (admin only)
            security:
                - bearerAuth: []
            parameters:
                - in: path
                  name: courseId
                  required: true
                  schema:
                      $ref: "#/components/schemas/ObjectId"
                  description: The course id to update
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateCourseRequest"
            responses:
                "200":
                    description: Course updated successfully
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                        example: true
                                    message:
                                        type: string
                                        example: Course updated successfully
                "400":
                    description: Bad request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "403":
                    description: Authentication or authorization failed
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "404":
                    description: Course not found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /{courseId}/archive:
        patch:
            tags:
                - Courses
            summary: Archive a course (admin only)
            security:
                - bearerAuth: []
            parameters:
                - in: path
                  name: courseId
                  required: true
                  schema:
                      $ref: "#/components/schemas/ObjectId"
                  description: The course id to archive
            responses:
                "200":
                    description: Course archived (or already archived)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                        example: Course archived successfully
                                    course:
                                        $ref: "#/components/schemas/Course"
                "404":
                    description: Course not found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "403":
                    description: Authentication or authorization failed
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /{courseId}/activate:
        patch:
            tags:
                - Courses
            summary: Activate a course (admin only)
            security:
                - bearerAuth: []
            parameters:
                - in: path
                  name: courseId
                  required: true
                  schema:
                      $ref: "#/components/schemas/ObjectId"
                  description: The course id to activate
            responses:
                "200":
                    description: Course activated (or already active)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    message:
                                        type: string
                                        example: Course activated successfully
                                    course:
                                        $ref: "#/components/schemas/Course"
                "403":
                    description: Authentication or authorization failed
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "404":
                    description: Course not found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
    /search:
        post:
            tags:
                - Courses
            summary: Search courses by name
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SearchCourseRequest"
            responses:
                "200":
                    description: Matching courses
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Course"
                "400":
                    description: Bad request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
components:
    schemas:
        CreateCourseRequest:
            type: object
            required:
                - name
                - description
                - price
            properties:
                name:
                    type: string
                    pattern: "^[a-zA-Z0-9 .,?!-]+$"
                    minLength: 1
                    example: "Introduction to JavaScript"
                description:
                    type: string
                    pattern: "^[^ ]?[a-zA-Z0-9 .,?!-]+$"
                    minLength: 1
                    example: "Learn JS from scratch"
                price:
                    type: number
                    format: float
                    example: 49.99
        UpdateCourseRequest:
            type: object
            properties:
                name:
                    type: string
                    pattern: "^[a-zA-Z0-9 .,?!-]+$"
                    minLength: 1
                    example: "Intro to JavaScript"
                description:
                    type: string
                    pattern: "^[^ ]?[a-zA-Z0-9 .,?!-]+$"
                    minLength: 1
                    example: "Updated course description"
                price:
                    type: number
                    format: float
                    example: 79.99
        SearchCourseRequest:
            type: object
            required:
                - courseName
            properties:
                courseName:
                    type: string
                    minLength: 1
                    pattern: "^[a-zA-Z0-9 .,?!-]+$"
                    example: "javascript"
        Course:
            type: object
            properties:
                _id:
                    $ref: "#/components/schemas/ObjectId"
                name:
                    type: string
                    pattern: "^[a-zA-Z0-9 .,?!-]+$"
                    minLength: 1
                    example: "Introduction to JavaScript"
                description:
                    type: string
                    pattern: "^[^ ]?[a-zA-Z0-9 .,?!-]+$"
                    minLength: 1
                    example: "Learn JS from scratch"
                price:
                    type: number
                    example: 49.99
                isActive:
                    type: boolean
                    example: true
                createdOn:
                    type: string
                    format: date-time
                    example: "2026-06-05T12:00:00Z"
        MessageResponse:
            type: object
            properties:
                message:
                    type: string
                    example: No active courses found
        ErrorResponse:
            type: object
            properties:
                message:
                    type: string
                    example: Course not found
        ObjectId:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
            minLength: 24
            maxLength: 24
            example: "64a1b2c3d4e5f60012345678"
