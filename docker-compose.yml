version: "3.8"

services:
    api:
        build: ./api
        ports:
            - "5000:5000"
        volumes:
            - ./api:/usr/src/app
            - /usr/src/app/node_modules
        env_file:
            - .env.dev # Updated here

    client:
        build: ./client
        ports:
            - "5173:5173"
        volumes:
            - ./client:/usr/src/app
            - /usr/src/app/node_modules
        env_file:
            - .env.dev
        depends_on:
            - api
