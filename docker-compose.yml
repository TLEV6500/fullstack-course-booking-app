services:
    api:
        build:
            context: ./api
            dockerfile: Dockerfile
            args:
                PORT: ${PORT:-5000}
        environment:
            - PORT=${PORT:-5000}
        ports:
            - "${PORT:-5000}:${PORT:-5000}"
        volumes:
            - ./api:/usr/src/app
            - /usr/src/app/node_modules
        env_file:
            - .env.dev

    client:
        build:
            context: ./client
            dockerfile: Dockerfile
            args:
                VITE_COURSE_BOOKING_API: $VITE_COURSE_BOOKING_API
        environment:
            - VITE_COURSE_BOOKING_API=$VITE_COURSE_BOOKING_API
        ports:
            - "5173:5173"
        volumes:
            - ./client:/usr/src/app
            - /usr/src/app/node_modules
        env_file:
            - .env.dev
        depends_on:
            - api
